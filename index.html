
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLIPX AI</title>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
body{font-family:Arial;background:#10101b;color:white;padding:20px}
.card{background:#202033;padding:20px;border-radius:16px;max-width:500px;margin:auto}
h1{color:#a78bfa}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border-radius:9px}
button{background:#7956ed;color:white;border:0;font-weight:bold}
video{width:100%;margin-top:15px}
a{color:#a78bfa}
</style>
</head>
<body>
<div class="card">
<h1>⚡ CLIPX AI</h1>
<p>AI Video Shortener Studio</p>
<input type="file" id="video" accept="video/*">
<label>Start time (seconds)</label>
<input id="start" type="number" value="0" min="0">
<label>Clip duration (seconds)</label>
<input id="duration" type="number" value="15" min="1">
<button id="cut">CREATE SHORT CLIP</button>
<p id="status">Upload a video to begin.</p>
<video id="preview" controls hidden></video>
<a id="download" hidden>⬇ Download your clip</a>
</div>

<script>
const {createFFmpeg,fetchFile}=FFmpeg;
const ffmpeg=createFFmpeg({
 log:true,
 corePath:'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
});

const $=id=>document.getElementById(id);
let outputURL=null;

$('cut').onclick=async()=>{
 const file=$('video').files[0];
 const start=Number($('start').value);
 const duration=Number($('duration').value);

 if(!file){$('status').textContent='Choose a video first.';return}
 if(!Number.isFinite(start)||!Number.isFinite(duration)||start<0||duration<=0){
 $('status').textContent='Enter valid times.';return;
 }

 const button=$('cut');
 button.disabled=true;

 try{
  $('status').textContent='Loading video engine...';
  if(!ffmpeg.isLoaded())await ffmpeg.load();

  $('status').textContent='Preparing video...';
  const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'');
  ffmpeg.FS('writeFile','input.'+ext,await fetchFile(file));

  $('status').textContent='Cutting your video...';
  await ffmpeg.run(
   '-ss',String(start),
   '-i','input.'+ext,
   '-t',String(duration),
   '-c:v','libx264',
   '-preset','ultrafast',
   '-c:a','aac',
   '-movflags','+faststart',
   'clip.mp4'
  );

  const data=ffmpeg.FS('readFile','clip.mp4');
  if(outputURL)URL.revokeObjectURL(outputURL);
  outputURL=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));

  $('preview').src=outputURL;
  $('preview').hidden=false;
  $('download').href=outputURL;
  $('download').download='CLIPX-short.mp4';
  $('download').hidden=false;
  $('status').textContent='🎉 Your clip is ready!';
 }catch(e){
  $('status').textContent='Error: '+e.message;
 }finally{
  button.disabled=false;
 }
};
</script>
</body>
</html>
